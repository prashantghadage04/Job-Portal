spring.application.name=job-portal

# MySQL connection (values come from docker-compose environment, defaults are for local runs)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:jobportal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:jobuser}
spring.datasource.password=${DB_PASSWORD:jobpass}

# Hibernate creates/updates tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# JWT (secret must be at least 32 characters)
jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random-123456}
jwt.expiration-ms=86400000

server.port=8080
