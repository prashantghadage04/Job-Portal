<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - JobPortal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>

  <div class="container auth-box">
    <div class="card">
      <h1>Create account</h1>
      <div id="message" class="msg"></div>
      <form id="registerForm">
        <label for="name">Full name</label>
        <input type="text" id="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" minlength="6" required>

        <label for="role">I am a</label>
        <select id="role">
          <option value="SEEKER">Job seeker (looking for jobs)</option>
          <option value="RECRUITER">Recruiter (posting jobs)</option>
        </select>

        <br><br>
        <button type="submit" style="width:100%">Register</button>
      </form>
      <p class="meta">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
